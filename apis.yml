aid: 17hats
name: 17hats
description: '17hats is an all-in-one CRM and business-management platform for service-based
  small businesses and solopreneurs, built around the idea that a one-person business
  wears seventeen hats. The platform combines lead capture, client pipelines, contact
  and project management, online scheduling, quotes, contracts and e-signature, questionnaires,
  invoicing and online payments, bookkeeping, email and SMS texting, and workflow automation
  into a single subscription product. 17hats states it serves more than 25,000 business
  owners across 100+ industries, including photographers, designers, coaches, planners
  and other service providers. 17hats does not publish a public developer program,
  API reference, or machine-readable specification; its only documented programmatic
  surface is an account-level API key issued from Account Settings > Integrations that
  authenticates its Zapier app, which exposes contact triggers and actions only.'
